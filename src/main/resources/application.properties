spring.application.name=city-issues

# Conexiune Baz? de Date (v5 pentru resetare total?)
spring.datasource.url=jdbc:h2:file:./data/city-issues-v5;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 'create' ?terge tot ?i recreeaz? tabelele corect conform codului Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080